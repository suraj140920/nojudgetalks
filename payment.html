<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JustListen | Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)),
                url("background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: white;
            padding: 40px 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        h2 {
            margin-bottom: 10px;
            color: #000;
        }

        p {
            color: #000;
            line-height: 1.6;
        }

        .button {
            padding: 14px 30px;
            background-color: #2c3e50;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 25px;
            font-size: 1rem;

            /* Hidden initially */
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;

            transition:
                opacity 0.6s ease,
                transform 0.6s ease,
                box-shadow 0.3s ease;
        }

        .button.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .button:hover {
            background-color: #1f2f3d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Payment</h2>
    <p>Pay to unlock your one-to-one listening session.</p>

    <p><strong>Session:</strong> 30 minutes (Flexible)</p>
    <p><strong>Price:</strong> ₹599 (Listening) &nbsp; | &nbsp; ₹799 (Advice & Guidance)</p>

    <a href="payment2.html" class="button" id="payBtn">
        Complete Payment
    </a>
</div>

<script>
    // Show payment button after 3.5 seconds
    setTimeout(() => {
        document.getElementById("payBtn").classList.add("show");
    }, 3500);
</script>

</body>
</html>
