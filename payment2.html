<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | JustListen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f8;
    text-align: center;
    padding: 40px;
}

.qr-wrapper {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

.qr-wrapper img {
    max-width: 300px;
    border-radius: 8px;
}

/* Download icon */
.download-icon {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.65);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 18px;
}

.download-icon:hover {
    background: rgba(0,0,0,0.85);
}

.hint {
    font-size: 0.9rem;
    color: #555;
    margin-top: 12px;
}
</style>
</head>

<body>

<h1>Complete Payment</h1>
<p>Please scan or download the QR code to confirm your session</p>

<div class="qr-wrapper">
    <img src="upi_QR_Code.jpg" alt="UPI QR Code">

    <!-- DOWNLOAD ICON -->
    <a href="upi_QR_Code.jpg" download="JustListen-upi_QR_Code.jpg" class="download-icon" title="Download QR">
        ⬇
    </a>
</div>

<p class="hint">Tap ⬇ to download QR or scan directly</p>

<p>After payment, you will be contacted at your selected time.</p>

</body>
</html>
