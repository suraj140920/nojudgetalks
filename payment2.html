<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | JustListen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding: 40px;
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.qr-wrapper {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

.qr-wrapper img {
    max-width: 300px;
    border-radius: 8px;
}

/* Download icon */
.download-icon {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.65);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 18px;
}

.download-icon:hover {
    background: rgba(0,0,0,0.85);
}

.hint {
    font-size: 0.9rem;
    color: #555;
    margin-top: 12px;
}

/* SESSION INFO BUTTON */
.session-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 28px;
    background: #2c3e50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 1rem;

    /* hidden initially */
    opacity: 0;
    transform: translateY(25px) scale(0.95);
    pointer-events: none;

    transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
}

.session-btn.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.session-btn:hover {
    background: #1f2f3d;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<h1>Complete Payment</h1>
<p>Please scan or download the QR code to confirm your session</p>

<div class="qr-wrapper">
    <img src="upi_QR_Code.jpg" alt="UPI QR Code">

    <a href="upi_QR_Code.jpg"
       download="JustListen-upi_QR_Code.jpg"
       class="download-icon"
       title="Download QR">
        ⬇
    </a>
</div>

<p class="hint">Tap ⬇ to download QR or scan directly</p>

<p>OR click below to download the QR code</p>

<br><br>

<a href="upi-qr.jpg"
   download="JustListen-UPI-QR.jpg"
   style="display:inline-block;padding:12px 25px;
          background:#2c3e50;color:white;
          text-decoration:none;border-radius:6px;">
   Download QR Code
</a>

<p style="margin-top:25px;">
    After payment, you will be contacted at your selected time.
</p>

<!-- FILL INFORMATION BUTTON -->
<a href="https://forms.gle/6jp4ELajiTeEPW4t7"
   class="session-btn"
   id="sessionBtn"
   target="_blank">
   Fill Information for Session
</a>

<script>
    // Show "Fill Information" button after 7 seconds
    setTimeout(() => {
        document.getElementById("sessionBtn").classList.add("show");
    }, 4000);
</script>

</body>
</html>
